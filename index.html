<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>School Hub</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; margin: 0; }
    .box { background: #1e293b; border: 2px solid #38bdf8; border-radius: 16px; padding: 18px; max-width: 390px; margin: 30px auto; }
    input, select, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: none; font-size: 15px; box-sizing: border-box; }
    input, select { background: #0f172a; color: white; border: 1px solid #334155; }
    button { background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
    .row { display: flex; gap: 8px; }
    .sm { width: auto; margin: 0; padding: 6px 10px; font-size: 13px; background: #334155; }
    #chatApp { display: none; flex-direction: column; height: 80vh; max-width: 390px; margin: 20px auto; background: #1e293b; border-radius: 16px; overflow: hidden; }
    .top { background: #0f172a; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    #msgList { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .b { max-width: 75%; padding: 9px 14px; border-radius: 16px; word-wrap: break-word; }
    .me { align-self: flex-end; background: #2563eb; border-bottom-right-radius: 3px; }
    .ot { align-self: flex-start; background: #334155; border-bottom-left-radius: 3px; }
    .item { background: #dbeafe; color: #0f172a; padding: 8px 12px; border-radius: 8px; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    #disScr { display: none; min-height: 100vh; background: #7c93f5; color: #0f172a; }
    .b-row { display: flex; border-bottom: 3px solid #1e293b; font-size: 26px; font-weight: bold; }
    .left { width: 28%; padding: 12px; border-right: 4px solid #1e293b; }
    .right { width: 72%; padding: 12px; background: #dbeafe; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <div id="home" class="box">
    <h2 style="margin:0; text-align:center; color:#38bdf8;">🏫 School Hub</h2>
    <input id="nk" placeholder="Your Name" />
    <input id="rm" placeholder="Room Code" />
    <input id="pw" type="password" placeholder="Room Password (Optional)" />
    <button onclick="enter('chatApp')">💬 Messages</button>
    <button style="background:#7c93f5; color:#0f172a;" onclick="enter('dTyp')">📱 Dismissal Typer</button>
    <button style="background:#10b981; color:#0f172a;" onclick="enter('disScr')">📺 Dismissal Screen</button>
    <div style="text-align:center; margin-top:10px; font-size:12px; color:#64748b; cursor:pointer;" onclick="home.style.display='none'; adm.style.display='block';">🛡️ Admin</div>
  </div>

  <div id="adm" class="box" style="display:none; border-color:#f59e0b;">
    <div class="row" style="justify-content:space-between;"><b style="color:#f59e0b;">🛡️ Admin</b><button class="sm" onclick="location.reload()">Exit</button></div>
    <div id="admAuth">
      <input id="apw" type="password" placeholder="Admin Password" onkeydown="if(event.key==='Enter') unlock()" />
      <button style="background:#f59e0b; color:#0f172a;" onclick="unlock()">Unlock</button>
    </div>
    <div id="admBody" style="display:none;">
      <button style="background:#dc2626;" onclick="del('rooms')">⚠️ Wipe All Rooms</button>
      <div id="admList"></div>
    </div>
  </div>

  <div id="chatApp">
    <div class="top"><b id="ct">Chat</b><button class="sm" onclick="location.reload()">Home</button></div>
    <div id="msgList"></div>
    <div class="row" style="padding:10px; background:#0f172a;">
      <input id="ci" style="margin:0; border-radius:99px;" placeholder="Message..." onkeydown="if(event.key==='Enter') postMsg()" />
      <button style="width:auto; margin:0; border-radius:99px; padding:10px 16px;" onclick="postMsg()">Send</button>
    </div>
  </div>

  <div id="dTyp" class="box" style="display:none; border-color:#7c93f5;">
    <div class="row" style="justify-content:space-between;"><b id="dt">Typer</b><button class="sm" onclick="location.reload()">Home</button></div>
    <div class="row">
      <input id="sn" placeholder="Student Name(s)" onkeydown="if(event.key==='Enter') postStu()" />
      <button style="width:auto; background:#7c93f5; color:#0f172a;" onclick="sn.value+=' & '; sn.focus()">+ &</button>
    </div>
    <div class="row">
      <select id="sg"><option>K</option><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option><option>6</option></select>
      <select id="sz"><option>🚗 Front Car</option><option>🚙 Back Car</option><option>🚌 Bus</option><option>🚶 Walker</option></select>
    </div>
    <button onclick="postStu()">Send</button>
    <button style="background:#475569;" onclick="del(`rooms/${room}/students`)">Clear All</button>
    <div id="sList"></div>
  </div>

  <div id="disScr">
    <div class="top">
      <b id="ds">Screen</b>
      <div class="row">
        <select id="sf" onchange="drawD()" style="width:auto; margin:0; padding:6px;"><option value="ALL">All Grades</option><option>K</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
        <button class="sm" onclick="location.reload()">Home</button>
      </div>
    </div>
    <div id="sBrd"></div>
  </div>

  <script>
    const DB = "https://school-hub-8354b-default-rtdb.firebaseio.com", ADMIN = "azlam123", uid = Math.random().toString(36).slice(2);
    let uName = '', room = '', mode = '', stu = [], lastM = 0;

    const api = (p, m = 'GET', b) => fetch(`${DB}/${p}.json`, { method: m, body: b ? JSON.stringify(b) : null }).then(r => r.json());

    async function unlock() {
      if (apw.value.trim() !== ADMIN) return alert("Wrong Password");
      admAuth.style.display = 'none'; admBody.style.display = 'block';
      const d = await api('rooms');
      admList.innerHTML = d ? Object.entries(d).map(([r, v]) => `
        <div style="background:#0f172a; padding:10px; border-radius:10px; margin-top:8px;">
          <b>${r}</b> <small style="color:#facc15;">${v.password ? '🔒 ' + v.password : '🔓'}</small>
          <div class="row" style="margin-top:6px;">
            <button class="sm" style="background:#0284c7;" onclick="del('rooms/${r}/msgs')">Chat</button>
            <button class="sm" style="background:#6366f1;" onclick="del('rooms/${r}/students')">Board</button>
            <button class="sm" style="background:#ef4444;" onclick="del('rooms/${r}')">Delete</button>
          </div>
        </div>`).join('') : '<p style="text-align:center; color:#94a3b8;">No rooms</p>';
    }

    async function del(p) { await api(p, 'DELETE'); admBody.style.display === 'block' ? unlock() : sync(); }

    async function enter(m) {
      if (DB.includes("PASTE_YOUR")) return alert("Paste your Firebase URL first!");
      uName = nk.value.trim() || 'User';
      room = rm.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      const p = pw.value.trim();
      if (!room) return alert('Enter a Room Code!');

      const cur = await api(`rooms/${room}`);
      if (cur?.password && cur.password !== p) return alert('🔒 Wrong Room Password!');
      if (!cur?.password && p) await api(`rooms/${room}/password`, 'PUT', p);

      mode = m; home.style.display = 'none';
      document.getElementById(m).style.display = m === 'chatApp' ? 'flex' : 'block';
      ct.innerText = dt.innerText = ds.innerText = (p ? '🔒 ' : '') + 'Room: ' + room;
      setInterval(sync, 1200); sync();
    }

    async function sync() {
      const d = await api(`rooms/${room}`);
      if (!d) { msgList.innerHTML = ''; stu = []; drawD(); return; }

      const msgs = d.msgs ? Object.values(d.msgs) : [];
      if (msgs.length !== lastM) {
        lastM = msgs.length;
        msgList.innerHTML = msgs.map(m => `<div class="b ${m.uid === uid ? 'me' : 'ot'}"><small style="opacity:0.7"><b>${m.uid === uid ? 'You' : m.u}</b></small><br>${m.txt}</div>`).join('');
        msgList.scrollTop = msgList.scrollHeight;
      }

      const next = d.students ? Object.entries(d.students).map(([k, v]) => ({ k, ...v })).reverse() : [];
      if (mode === 'disScr' && next.length > stu.length && next.at(0) && (sf.value === 'ALL' || sf.value === next.at(0).grade)) {
        speechSynthesis.speak(new SpeechSynthesisUtterance(next.at(0).name));
      }
      stu = next; drawD();
    }

    async function postMsg() { if (ci.value.trim()) { const t = ci.value.trim(); ci.value = ''; await api(`rooms/${room}/msgs`, 'POST', { uid, u: uName, txt: t }); sync(); } }
    async function postStu() { if (sn.value.trim()) { const n = sn.value.trim(); sn.value = ''; await api(`rooms/${room}/students`, 'POST', { name: n, grade: sg.value, zone: sz.value }); sync(); } }

    function drawD() {
      sList.innerHTML = stu.map(s => `<div class="item"><span>${s.name}</span><button class="sm" style="background:#ef4444; color:white;" onclick="del('rooms/${room}/students/${s.k}')">Done</button></div>`).join('');
      sBrd.innerHTML = stu.filter(s => sf.value === 'ALL' || s.grade === sf.value)
        .map(s => `<div class="b-row"><div class="left">${s.name.includes('&') ? 'Siblings' : 'Grade ' + s.grade}</div><div class="right"><span>${s.name}</span><span>${s.zone}</span></div></div>`).join('');
    }
  </script>
</body>
</html>
